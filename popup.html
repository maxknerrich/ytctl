<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ytctl</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="bar">
      <span id="avatar" class="avatar" aria-hidden="true">▶</span>
      <div class="who">
        <h1 id="title">ytctl</h1>
        <p id="context" class="muted">Connecting to YouTube…</p>
      </div>
      <button id="open-settings" class="icon-btn" type="button" aria-label="Open settings" title="Settings"></button>
    </header>

    <p id="unavailable" class="empty muted" hidden>Open a YouTube video or Short to control its speed.</p>

    <section id="speed" class="speed" aria-label="Playback speed" hidden>
      <div class="dial">
        <button id="decrease" class="icon-btn step" type="button" aria-label="Decrease speed"></button>
        <label class="readout">
          <span class="sr-only">Current playback speed</span>
          <input id="current-speed" type="number" min="0.25" max="4" step="0.05">
          <span aria-hidden="true">×</span>
        </label>
        <button id="increase" class="icon-btn step" type="button" aria-label="Increase speed"></button>
      </div>
      <p class="source">
        <span id="source" class="muted"></span>
        <button id="reset" class="link-btn" type="button">Reset</button>
      </p>
      <div id="presets" class="chips" role="group" aria-label="Quick speeds"></div>
    </section>

    <section id="rule" class="rule" aria-labelledby="rule-label" hidden>
      <label id="rule-label" for="assignment">Always play this creator’s <span id="kind-name">videos</span> at</label>
      <div class="rule-row">
        <select id="assignment" class="select"></select>
        <span id="custom-field" class="speed-field" hidden>
          <input id="custom-speed" type="number" min="0.25" max="4" step="0.05" aria-label="Custom creator speed">
        </span>
      </div>
      <div class="rule-actions">
        <button id="save-current" class="btn" type="button" hidden></button>
        <button id="update-profile" class="btn ghost" type="button" hidden></button>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
